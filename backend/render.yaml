services:
  - type: web
    name: transport-routes-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://your-app.vercel.app
      - key: PLANNER_TOKEN
        sync: false
